[project]
name = "cms-npd-ingest"
version = "0.1.0"
description = "Stream the CMS National Provider Directory (NPD) bulk files into a local DuckDB database"
readme = "README.md"
authors = [{ name = "Craig Wohlfeil", email = "crwohlfeil@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cms-npd-ingest = "cms_npd_ingest:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
